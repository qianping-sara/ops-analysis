[project]
name = "claude-agent-platform"
version = "0.1.0"
description = "Claude Agent Platform — analysis Agent (Phase 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlparse>=0.5.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
claude-agent-platform = "claude_agent_platform.main:run"
claude-agent-postgres-mcp = "claude_agent_platform.mcp.postgres_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_agent_platform"]

[tool.hatch.build.targets.wheel.sources]
"src/claude_agent_platform" = "claude_agent_platform"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
